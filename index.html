<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kebiasaan</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F7D6B">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#EEF1EC;--card:#fff;--ink:#1F2A24;--mute:#6B776F;--line:#DCE2DA;--acc:#2F7D6B;--acc2:#E8B04A;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#141A17;--card:#1D2621;--ink:#E7EEE9;--mute:#93A197;--line:#2C3830;--acc:#4FB79E;--acc2:#E8B04A;--on:#0F1512}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;line-height:1.1;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:0 0 22px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wk b{font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.nav{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.emo{font-size:24px}.nm{flex:1;font-weight:600;overflow-wrap:anywhere}
.st{font-size:14px;color:var(--mute)}.st.hot{color:var(--acc2);font-weight:600}
.more{background:none;border:0;color:var(--mute);font-size:20px;padding:4px 8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
.d button{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:none}
.d button.on{background:var(--acc);border-color:var(--acc)}
.d button.on::after{content:"✓";color:var(--on);font-weight:700}
.d.today span{color:var(--ink);font-weight:700}.d.today button:not(.on){border-color:var(--acc)}
.d button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
form{display:flex;gap:8px;margin:20px 0 8px}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
#e{width:64px;text-align:center}#n{flex:1;min-width:0}
.add{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:0 18px;font-weight:600}
.empty{text-align:center;color:var(--mute);padding:28px 8px;border:1px dashed var(--line);border-radius:16px}
.tools{display:flex;gap:14px;justify-content:center;margin-top:24px;font-size:14px}
.tools button{background:none;border:0;color:var(--mute);text-decoration:underline}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<h1>Kebiasaan</h1>
<p class="sub" id="sum"></p>
<div class="bar"><i id="pb"></i></div>
<div class="wk"><button class="nav" id="pv" aria-label="Minggu sebelumnya">‹</button><b id="wl"></b><button class="nav" id="nx" aria-label="Minggu berikutnya">›</button></div>
<div id="list"></div>
<form id="f"><input id="e" value="🌱" maxlength="4" aria-label="Emoji"><input id="n" placeholder="Kebiasaan baru, mis. Minum air 2 liter" maxlength="60" required aria-label="Nama kebiasaan"><button class="add">Tambah</button></form>
<div class="tools"><button id="ex">Cadangkan data</button><button id="im">Pulihkan data</button></div>
<input type="file" id="fi" accept="application/json" hidden>
</main>
<script>
const K='kebiasaan-v1',$=s=>document.querySelector(s);
let S={habits:[]},off=0;
try{S=JSON.parse(localStorage.getItem(K))||S}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=new Date();today.setHours(0,0,0,0);
const TK=key(today),L=['S','S','R','K','J','S','M'];
function monday(o){const d=new Date(today);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d}
function streak(h){const d=new Date(today);if(!h.done[key(d)])d.setDate(d.getDate()-1);let n=0;while(h.done[key(d)]){n++;d.setDate(d.getDate()-1)}return n}
const fm=d=>d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
function render(){
 const m=monday(off),e=new Date(m);e.setDate(e.getDate()+6);
 $('#wl').textContent=off===0?'Minggu ini':fm(m)+' – '+fm(e);
 $('#nx').disabled=off>=0;
 const dn=S.habits.filter(h=>h.done[TK]).length,t=S.habits.length;
 $('#sum').textContent=t?`${dn} dari ${t} selesai hari ini`:'Mulai dengan satu kebiasaan kecil.';
 $('#pb').style.width=(t?dn/t*100:0)+'%';
 const box=$('#list');box.innerHTML='';
 if(!t){box.innerHTML='<div class="empty">Belum ada kebiasaan. Tulis satu di bawah, lalu centang tiap hari.</div>';return}
 S.habits.forEach(h=>{
  const c=document.createElement('div');c.className='card';
  const s=streak(h);
  c.innerHTML=`<div class="top"><span class="emo"></span><span class="nm"></span><span class="st${s>=3?' hot':''}">${s?s+' hari beruntun':'—'}</span><button class="more" aria-label="Hapus kebiasaan">⋯</button></div><div class="days"></div>`;
  c.querySelector('.emo').textContent=h.emoji;c.querySelector('.nm').textContent=h.name;
  c.querySelector('.more').onclick=()=>{if(confirm(`Hapus "${h.name}" beserta riwayatnya?`)){S.habits=S.habits.filter(x=>x!==h);save();render()}};
  const dv=c.querySelector('.days');
  for(let i=0;i<7;i++){
   const d=new Date(m);d.setDate(d.getDate()+i);const k=key(d);
   const w=document.createElement('div');w.className='d'+(k===TK?' today':'');
   const b=document.createElement('button');b.className=h.done[k]?'on':'';b.disabled=d>today;
   b.setAttribute('aria-label',`${h.name}, ${d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}`);
   b.setAttribute('aria-pressed',!!h.done[k]);
   b.onclick=()=>{h.done[k]?delete h.done[k]:h.done[k]=1;save();render()};
   w.innerHTML=`<span>${L[i]}</span>`;w.appendChild(b);dv.appendChild(w);
  }
  box.appendChild(c);
 });
}
$('#pv').onclick=()=>{off--;render()};$('#nx').onclick=()=>{if(off<0){off++;render()}};
$('#f').onsubmit=ev=>{ev.preventDefault();const n=$('#n').value.trim();if(!n)return;
 S.habits.push({id:Date.now(),name:n,emoji:$('#e').value.trim()||'🌱',done:{}});save();$('#n').value='';render()};
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='kebiasaan-'+TK+'.json';a.click()};
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=async ev=>{try{const j=JSON.parse(await ev.target.files[0].text());if(Array.isArray(j.habits)&&confirm('Ganti data sekarang dengan cadangan ini?')){S=j;save();render()}}catch(e){alert('File cadangan tidak valid.')}ev.target.value=''};
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
